name: Build Sensi APK

'on':
workflow_dispatch:
push:
paths:
- "TECNO_CAMON30S_Sensi_App_Project.zip"
- ".github/workflows/android.yml"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Install Android Command-line Tools
    shell: bash
    run: |
      set -e

      mkdir -p "$ANDROID_HOME/cmdline-tools"
      cd "$RUNNER_TEMP"

      curl -fL \
        https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
        -o android-tools.zip

      mkdir -p android-tools
      unzip -q android-tools.zip -d android-tools

      mv android-tools/cmdline-tools \
        "$ANDROID_HOME/cmdline-tools/latest"

      echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

  - name: Accept Android SDK Licenses
    shell: bash
    run: |
      set -e
      printf 'y\n%.0s' {1..100} | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

  - name: Install Android SDK Components
    shell: bash
    run: |
      set -e
      sdkmanager --sdk_root="$ANDROID_HOME" --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Extract project ZIP
    shell: bash
    run: |
      set -e

      if [ ! -f "TECNO_CAMON30S_Sensi_App_Project.zip" ]; then
        echo "ERROR: Project ZIP file was not found in the repository root."
        exit 1
      fi

      mkdir -p source
      unzip -o "TECNO_CAMON30S_Sensi_App_Project.zip" -d source

  - name: Locate Android Project
    shell: bash
    run: |
      set -e

      PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" \
        -type f -name settings.gradle -o -name settings.gradle.kts \
        -print -quit | xargs -r dirname)"

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: settings.gradle or settings.gradle.kts was not found inside the ZIP."
        echo "Please check the ZIP folder structure."
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android project found: $PROJECT_DIR"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build Debug APK
    shell: bash
    run: |
      set -e
      gradle -p "$PROJECT_DIR" assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: CAMON30S-Sensi-APK
      path: source/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
